<h1 class="animate__animated animate__bounce">Virtual Scroll</h1>
<hr>

<div class="row">

  <div class="col-md-4">
    <button class="btn btn-primary"
            (click)="irFinal()"
    >
      Ir al final
    </button>
  </div>

  <div class="col-md-4">
    <button class="btn btn-danger"
            (click)="irMitad()"
    >
      Ir a la mitad
    </button>
  </div>

  <div class="col-md-4">
    <button class="btn btn-warning"
            (click)="irInicio()"
    >
      Ir al inicio
    </button>
  </div>

</div>

<br>
<hr>


<cdk-virtual-scroll-viewport itemSize="50" class="list-container list-group">
  <div *cdkVirtualFor="let persona of personas; let i=index; let cantidad=count" class="list-group-item">
    Item {{i}} / {{cantidad}}
  </div>
</cdk-virtual-scroll-viewport>
